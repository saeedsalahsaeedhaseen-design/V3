name: Build Barq Sher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto Unzip Project Files if zipped
        run: |
          echo "Checking repository structure..."
          ls -la
          # If a zip file was uploaded directly, find and unzip it to root
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE. Unzipping..."
            unzip -o "$ZIP_FILE" -d .
            rm -f "$ZIP_FILE"
          fi
          # Also handle case where files are nested inside a subfolder
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            SUB_DIR=$(find . -mindepth 1 -maxdepth 1 -type d | grep -v "\.git" | head -n 1)
            if [ -n "$SUB_DIR" ] && [ -f "$SUB_DIR/settings.gradle.kts" -o -f "$SUB_DIR/settings.gradle" ]; then
              echo "Moving files from nested directory $SUB_DIR to root..."
              mv "$SUB_DIR"/* .
            fi
          fi
          echo "Final root structure:"
          ls -la

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate missing debug.keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Ready APK (Barq-Sher.apk)
        uses: actions/upload-artifact@v4
        with:
          name: Barq-Sher-APK
          path: app/build/outputs/apk/debug/*.apk
          
